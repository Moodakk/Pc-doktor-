[project]
name = "dental-archive-manager"
dynamic = ["version"]
description = "Offline dental imaging archive organizer with verified copy and safe cleanup workflow"
requires-python = ">=3.11"
dependencies = [
  "pydicom==3.0.1",
  "Pillow==12.2.0",
  "Send2Trash==2.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dental_archive"]

[tool.setuptools.dynamic]
version = {attr = "dental_archive.__version__"}

[tool.unittest]
start-directory = "tests"
