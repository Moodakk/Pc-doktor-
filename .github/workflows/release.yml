name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DentalArchiveManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Build EXE with PyInstaller
        run: pyinstaller DentalArchiveManager.spec --noconfirm
      - name: Assemble release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist/DentalArchiveManager.exe release/
          Copy-Item CREATE_DEMO_DATA.bat release/
          Copy-Item README_UA.md release/
          Copy-Item ../README.md release/README.md
          Compress-Archive -Path release/* -DestinationPath "DentalArchiveManager-${{ github.ref_name }}-windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DentalArchiveManager-windows
          path: DentalArchiveManager/DentalArchiveManager-*.zip
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DentalArchiveManager/DentalArchiveManager-*.zip
